<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Menlo, monospace" font-size="13">
  <rect width="860" height="400" rx="10" fill="#0b0e14"/>
  <!-- alert -->
  <rect x="330" y="18" width="200" height="40" rx="8" fill="#3a1220" stroke="#ff5c5c"/>
  <text x="430" y="43" fill="#ff5c5c" text-anchor="middle">🚨 PagerDuty alert</text>
  <line x1="430" y1="58" x2="430" y2="86" stroke="#7d8aa5" marker-end="url(#a)"/>
  <!-- supervisor -->
  <rect x="290" y="88" width="280" height="48" rx="8" fill="#171226" stroke="#b78aff"/>
  <text x="430" y="112" fill="#b78aff" text-anchor="middle">👑 SUPERVISOR (Claude)</text>
  <text x="430" y="128" fill="#7d8aa5" text-anchor="middle" font-size="11">incident commander — plans &amp; dispatches</text>
  <!-- specialists -->
  <g stroke="#7d8aa5">
    <line x1="360" y1="136" x2="120" y2="180" marker-end="url(#a)"/>
    <line x1="405" y1="136" x2="330" y2="180" marker-end="url(#a)"/>
    <line x1="455" y1="136" x2="530" y2="180" marker-end="url(#a)"/>
    <line x1="500" y1="136" x2="740" y2="180" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle">
    <rect x="30" y="182" width="180" height="46" rx="8" fill="#12161f" stroke="#5aa2ff"/>
    <text x="120" y="202" fill="#5aa2ff">Log Analyst</text>
    <text x="120" y="219" fill="#7d8aa5" font-size="10">read_logs · grep_logs</text>
    <rect x="240" y="182" width="180" height="46" rx="8" fill="#12161f" stroke="#f5b83d"/>
    <text x="330" y="202" fill="#f5b83d">Root-Cause Inv.</text>
    <text x="330" y="219" fill="#7d8aa5" font-size="10">deploys · configs</text>
    <rect x="450" y="182" width="180" height="46" rx="8" fill="#12161f" stroke="#38d39f"/>
    <text x="540" y="202" fill="#38d39f">Fix Engineer</text>
    <text x="540" y="219" fill="#7d8aa5" font-size="10">propose_patch</text>
    <rect x="660" y="182" width="180" height="46" rx="8" fill="#12161f" stroke="#ff9ecb"/>
    <text x="750" y="202" fill="#ff9ecb">Comms Writer</text>
    <text x="750" y="219" fill="#7d8aa5" font-size="10">draft_status_page</text>
  </g>
  <!-- env -->
  <line x1="430" y1="228" x2="430" y2="256" stroke="#7d8aa5" marker-end="url(#a)"/>
  <rect x="130" y="258" width="600" height="44" rx="8" fill="#12161f" stroke="#232a3a"/>
  <text x="430" y="278" fill="#dbe2ef" text-anchor="middle">Production environment (simulated) — 5 microservices</text>
  <text x="430" y="294" fill="#7d8aa5" text-anchor="middle" font-size="11">logs · metrics · configs · deploy history</text>
  <!-- gate + dashboard -->
  <rect x="130" y="330" width="280" height="46" rx="8" fill="#1f1a10" stroke="#f5b83d"/>
  <text x="270" y="350" fill="#f5b83d" text-anchor="middle">🖐 HUMAN APPROVAL GATE</text>
  <text x="270" y="366" fill="#7d8aa5" text-anchor="middle" font-size="11">no mutation without sign-off</text>
  <rect x="450" y="330" width="280" height="46" rx="8" fill="#0f2b22" stroke="#38d39f"/>
  <text x="590" y="350" fill="#38d39f" text-anchor="middle">Live ops-room dashboard</text>
  <text x="590" y="366" fill="#7d8aa5" text-anchor="middle" font-size="11">every thought &amp; tool call, streamed (SSE)</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#7d8aa5"/>
    </marker>
  </defs>
</svg>
